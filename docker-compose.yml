version: '3.8'

networks:
  forum_net:
    driver: bridge

volumes:
  flarum_db_data:
  loki_data:

services:
  flarum_db:
    image: mariadb:10.5
    container_name: flarum_db
    restart: always
    networks:
      - forum_net
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: flarum
      MYSQL_USER: flarum
      MYSQL_PASSWORD: flarum-password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - flarum_db_data:/var/lib/mysql

  flarum_phpmyadmin:
    image: phpmyadmin:latest
    container_name: flarum_phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: flarum_db
      MYSQL_ROOT_PASSWORD: rootpassword
    networks:
      - forum_net

  flarum_app:
    image: mondiedigital/flarum:latest
    container_name: flarum_app
    restart: always
    networks:
      - forum_net
    environment:
      FORUM_URL: http://localhost:8080
      DB_HOST: flarum_db
      DB_NAME: flarum
      DB_USER: flarum
      DB_PASS: flarum-password
      DB_PORT: 3306

  flarum_nginx:
    image: nginx:alpine
    container_name: flarum_nginx
    restart: always
    ports:
      - "8080:80"
    networks:
      - forum_net
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./var_log_nginx:/var/log/nginx

  flarum_prometheus:
    image: prom/prometheus:latest
    container_name: flarum_prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - forum_net

  flarum_loki:
    image: grafana/loki:2.9.0
    container_name: flarum_loki
    restart: always
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - forum_net
    volumes:
      - loki_data:/tmp/loki

  flarum_promtail:
    image: grafana/promtail:2.9.0
    container_name: flarum_promtail
    restart: always
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - forum_net

  flarum_grafana:
    image: grafana/grafana:latest
    container_name: flarum_grafana
    restart: always
    ports:
      - "3000:3000"
    networks:
      - forum_net
